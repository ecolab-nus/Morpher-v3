---
 memory_mode: "auto"
 arch_template_json: "hycube_original_updatemem2.json"
 mapper_subfolder: 'hycube'
 dfg_type: 'PartPred'
 init_II: 1
 ydim: 4
 xdim: 4
 numberofbanks: 4
 banksize: 2048
 max_test_samples: 5
 mapping_method: 2
 backtrack_limit: 4
 max_mapper_iter: 30
 max_II: 32
 ii_restarts: 0
 skip_ii_estimation: false
 print_dfg: true
 sa_seed: 0
 sa_restarts: 2
 sa_moves_per_temp: 20
 sa_temp_max: 200.0
 sa_temp_min: 10.0
 sa_candidate_topk: 8
 enable_simulation: false
 spm_mode: 'off'
 llvm_debug_type: 'no'
 remove_agi: true

# II=1 partition mode settings (used when runmode=ii1_partition)
 ii1_partition_target_size: 11    # initial target nodes per partition (before store/load additions)
 ii1_partition_min_size: 5        # minimum partition size for recursive sub-partitioning
 ii1_partition_balance_tolerance: 0.35
 ii1_partition_hard_fail: true
 ii1_partition_max_loads_per_chunk: "auto"
 ii1_partition_max_stores_per_chunk: "auto"
