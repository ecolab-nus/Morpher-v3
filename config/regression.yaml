# Regression-gate config: pins a stable, reproducible single run per kernel.
# Auto-unroll and source templates are disabled so the DFG (and therefore the
# achieved II) does not drift when mapper II-search heuristics change. The gate
# asserts II does not regress and simulation validation stays clean.
memory_mode: auto
arch_template_json: edge_mem_4x4/scalar_3side.json
mapper_subfolder: hycube
mapper_preset: trusted_pf
init_II: 1
multihop: 4
max_test_samples: 2
enable_simulation: true
validation_mode: functional
spm_mode: 'off'

dfg_pipeline:
  # Conservative C++ removal: skip iterator removal if control still reaches
  # mapped work; AGI externalization remains applied.
  externalize_access: agi_iter
layout_solver: false
replicate_data: false

source_template:
  enabled: off

auto_unroll:
  enabled: false
