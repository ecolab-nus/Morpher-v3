memory_mode: auto
arch_template_json: edge_mem_4x4/scalar_3side.json
mapper_subfolder: hycube
mapper_preset: exhaust
init_II: 1
multihop: 4
max_test_samples: 2
enable_simulation: true
validation_mode: functional
spm_mode: 'off'

dfg_pipeline:
  externalize_access: agi_iter
  boundary_canonicalization: verified
  # Request the reset-backed lowering exposed by the selected architecture's
  # ARCH.CAPABILITIES.TREG_RESET_ON_LAUNCH declaration.
  treg_reset_on_launch: true

layout_solver: false
replicate_data: false

source_template:
  enabled: off

auto_unroll:
  enabled: false
  factors: [1]
  stop_on_degradation: true
  scalar_reduction_policy: "none"
