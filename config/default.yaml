memory_mode: "auto"
arch_template_json: "hycube_original_updatemem.json"
mapper_subfolder: 'hycube'
mapper_preset: "balanced"
init_II: 1
multihop: 4
max_test_samples: 5
enable_simulation: true
validation_mode: "event-driven"
spm_mode: 'off'
remove_agi: true
auto_unroll:
  enabled: false
  factors: [1, 2, 4, 8]
  remainder_policy: preserve
  stop_on_degradation: true
simd:
  enabled: true
  lanes: 8
  pack_load_store: true
  reduction_policy: packed-psum
