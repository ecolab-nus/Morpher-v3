memory_mode: auto
arch_template_json: hycube_original_updatemem.json
mapper_subfolder: hycube
mapper_preset: trusted_pf
init_II: 1
multihop: 4
max_test_samples: 2
enable_simulation: true
validation_mode: functional
spm_mode: 'off'

# Trusted scalar defaults: keep semantics in the LLVM/DFG pipeline and emit XML
# once for the mapper. Experimental Python XML transforms must opt in elsewhere.
remove_agi: false
remove_iter: false
layout_solver: false
replicate_data: false
experimental_python_semantic_transforms: false

source_template:
  enabled: off

auto_unroll:
  enabled: false
  factors: [1]
  stop_on_degradation: true
  scalar_reduction_policy: "none"
