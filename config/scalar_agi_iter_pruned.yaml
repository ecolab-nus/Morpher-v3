memory_mode: auto
arch_template_json: hycube_original_updatemem.json
mapper_subfolder: hycube
mapper_preset: trusted_pf
init_II: 1
multihop: 4
max_test_samples: 2
enable_simulation: false
validation_mode: functional
spm_mode: 'off'

# Restricted trace-driven iterator externalization. This is accepted only
# when the post-AGI iterator/control component has no edge to mapped work.
dfg_pipeline:
  externalize_access: agi_iter
remove_iter: false
layout_solver: false
replicate_data: false
experimental_python_semantic_transforms: false

source_template:
  enabled: off

auto_unroll:
  enabled: false
  factors: [1]
  stop_on_degradation: true
  scalar_reduction_policy: "none"
