memory_mode: auto
arch_template_json: hycube_vectorized.json
mapper_subfolder: hycube
mapper_preset: "fast"
init_II: 1
multihop: 4
max_test_samples: 5
enable_simulation: true
validation_mode: functional
spm_mode: 'off'
remove_agi: true
remove_iter: true
experimental_python_semantic_transforms: true
layout_solver: true
replicate_data: false
auto_unroll:
  enabled: true
  factors: [1, 4, 8, 16, 32]
  stop_on_degradation: true
  scalar_reduction_policy: "scalar-psum"
