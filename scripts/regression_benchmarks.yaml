suites:
  ci_4x4:
    description: Trusted scalar 4x4 mapper regression suite for CI and pre-commit checks.
    config: config/default.yaml
    runmode: runall
    jobs: 4
    timeout_sec: 720
    benchmarks:
      # Conditional/control benchmark: exercises mutex basic-block handling.
      - benchmark: morpher_benchmarks/array_cond/array_cond.c
        function: array_cond
        max_ii: 4

  ci_4x4_scalar_agi:
    description: 4x4 scalar regression suite that preserves AGI and iterator structure.
    config: config/scalar.yaml
    runmode: runall
    jobs: 4
    timeout_sec: 720
    benchmarks:
      # Control-heavy Morpher kernel in scalar mode with AGI preserved.
      - benchmark: morpher_benchmarks/array_cond/array_cond.c
        function: array_cond
        max_ii: 4
      # MachSuite stencil exercises address generation without SIMD packing.
      - benchmark: machsuite/stencil2d/stencil2d.c
        function: stencil2d
        max_ii: 8

  ci_4x4_scalar_agi_pruned:
    description: 4x4 scalar regression suite for C++ DFG-side AGI externalization with manifest validation.
    config: config/scalar_agi_pruned.yaml
    runmode: runall
    jobs: 4
    timeout_sec: 720
    benchmarks:
      - benchmark: morpher_benchmarks/array_cond/array_cond.c
        function: array_cond
        max_ii: 4

  ci_4x4_simd4_noiter:
    description: 4x4 SIMD-4 regression suite with iterator pruning enabled.
    config: config/simd4_noiter.yaml
    runmode: runall
    jobs: 4
    timeout_sec: 720
    benchmarks:
      # Compact convolution is a good SIMD/no-iter smoke test.
      - benchmark: cgrame_microbench/conv2/conv2.c
        function: conv2
        max_ii: 4

  ci_4x4_gemm_simd4_unroll:
    description: 4x4 GEMM regression with SIMD-4, auto-unroll, AGI removal, and iterator pruning.
    config: config/regression_gemm_simd4_unroll.yaml
    runmode: runall
    jobs: 1
    timeout_sec: 720
    benchmarks:
      - benchmark: polybench/gemm/gemm.c
        function: gemm
        max_ii: 8

  ci_8x8:
    description: Minimal 8x8 mapper regression suite; kept small because 8x8 runs are slower.
    config: config/regression_8x8.yaml
    runmode: runall
    jobs: 8
    timeout_sec: 720
    benchmarks:
      # Microbench convolution on the larger fabric.
      - benchmark: cgrame_microbench/conv2/conv2.c
        function: conv2
        max_ii: 4
      # Streaming benchmark on the larger fabric.
      - benchmark: opencgra_benchmarks/fir/fir.c
        function: fir
        max_ii: 4
