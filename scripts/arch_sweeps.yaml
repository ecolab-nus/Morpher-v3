suites:
  edge_mem_arch_sweep:
    description: Sweep non-VRED edge_mem_4x4 architecture JSONs across auto-unroll search, SPM modeling, and multihop settings.
    base_config: config/default.yaml
    runmode: runall
    jobs: 4
    timeout_sec: 3600
    common_overrides:
      memory_mode: auto
      mapper_subfolder: hycube
      mapper_preset: fast
      enable_simulation: false
      validation_mode: functional
      layout_solver: false
      replicate_data: false
    arches:
    - edge_mem_4x4/scalar_1side.json
    - edge_mem_4x4/scalar_2side.json
    - edge_mem_4x4/scalar_2side_unidir.json
    - edge_mem_4x4/scalar_3side.json
    - edge_mem_4x4/scalar_4side.json
    - edge_mem_4x4/scalar_4side_unidir.json
    - edge_mem_4x4/vec4_1side.json
    - edge_mem_4x4/vec4_2side.json
    - edge_mem_4x4/vec4_2side_unidir.json
    - edge_mem_4x4/vec4_3side.json
    - edge_mem_4x4/vec4_4side.json
    - edge_mem_4x4/vec4_4side_unidir.json
    - edge_mem_4x4/vec8_1side.json
    - edge_mem_4x4/vec8_2side.json
    - edge_mem_4x4/vec8_2side_unidir.json
    - edge_mem_4x4/vec8_3side.json
    - edge_mem_4x4/vec8_4side.json
    - edge_mem_4x4/vec8_4side_unidir.json
    variants:
    - name: scalar_pruned_spmoff_h1
      description: Scalar architectures, AGI/iterator pruning enabled, auto-unroll search over 1/2/4/8, spm_mode=off, multihop=1.
      arch_filter:
      - ^edge_mem_4x4/scalar_.*\.json$
      overrides:
        dfg_pipeline:
          externalize_access: agi_iter
        spm_mode: 'off'
        multihop: 1
        auto_unroll:
          enabled: true
          factors:
          - 1
          - 2
          - 4
          - 8
          stop_on_degradation: true
    - name: scalar_pruned_spmoff_h4
      description: Scalar architectures, AGI/iterator pruning enabled, auto-unroll search over 1/2/4/8, spm_mode=off, multihop=4.
      arch_filter:
      - ^edge_mem_4x4/scalar_.*\.json$
      overrides:
        dfg_pipeline:
          externalize_access: agi_iter
        spm_mode: 'off'
        multihop: 4
        auto_unroll:
          enabled: true
          factors:
          - 1
          - 2
          - 4
          - 8
          stop_on_degradation: true
    - name: scalar_pruned_spmon_h1
      description: Scalar architectures, AGI/iterator pruning enabled, auto-unroll search over 1/2/4/8, spm_mode=on, multihop=1.
      arch_filter:
      - ^edge_mem_4x4/scalar_.*\.json$
      overrides:
        dfg_pipeline:
          externalize_access: agi_iter
        spm_mode: 'on'
        multihop: 1
        auto_unroll:
          enabled: true
          factors:
          - 1
          - 2
          - 4
          - 8
          stop_on_degradation: true
    - name: scalar_pruned_spmon_h4
      description: Scalar architectures, AGI/iterator pruning enabled, auto-unroll search over 1/2/4/8, spm_mode=on, multihop=4.
      arch_filter:
      - ^edge_mem_4x4/scalar_.*\.json$
      overrides:
        dfg_pipeline:
          externalize_access: agi_iter
        spm_mode: 'on'
        multihop: 4
        auto_unroll:
          enabled: true
          factors:
          - 1
          - 2
          - 4
          - 8
          stop_on_degradation: true
    - name: vector_pruned_spmoff_h1
      description: Vector architectures, AGI/iterator pruning enabled, auto-unroll search over 4/8/16/32, spm_mode=off, multihop=1.
      arch_filter:
      - ^edge_mem_4x4/vec(4|8)_(1|2|3|4)side(_unidir)?\.json$
      overrides:
        dfg_pipeline:
          externalize_access: agi_iter
        spm_mode: 'off'
        multihop: 1
        auto_unroll:
          enabled: true
          factors:
          - 4
          - 8
          - 16
          - 32
          stop_on_degradation: true
    - name: vector_pruned_spmoff_h4
      description: Vector architectures, AGI/iterator pruning enabled, auto-unroll search over 4/8/16/32, spm_mode=off, multihop=4.
      arch_filter:
      - ^edge_mem_4x4/vec(4|8)_(1|2|3|4)side(_unidir)?\.json$
      overrides:
        dfg_pipeline:
          externalize_access: agi_iter
        spm_mode: 'off'
        multihop: 4
        auto_unroll:
          enabled: true
          factors:
          - 4
          - 8
          - 16
          - 32
          stop_on_degradation: true
    - name: vector_pruned_spmon_h1
      description: Vector architectures, AGI/iterator pruning enabled, auto-unroll search over 4/8/16/32, spm_mode=on, multihop=1.
