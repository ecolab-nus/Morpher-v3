      overrides:
        dfg_pipeline:
          externalize_access: off
        spm_mode: 'off'
        multihop: 1
        auto_unroll:
          enabled: true
          factors:
          - 1
          - 2
          - 4
          - 8
          stop_on_degradation: true
    - name: scalar_baseline_spmoff_h4
      description: Scalar baseline with AGI/iterator pruning disabled, auto-unroll search over 1/2/4/8, spm_mode=off, multihop=4.
      arch_filter:
      - ^edge_mem_4x4/scalar_.*\.json$
      overrides:
        dfg_pipeline:
          externalize_access: off
        spm_mode: 'off'
        multihop: 4
        auto_unroll:
          enabled: true
          factors:
          - 1
