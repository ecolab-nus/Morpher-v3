          - 4
          - 8
          stop_on_degradation: true
    - name: scalar_baseline_spmon_h1
      description: Scalar baseline with AGI/iterator pruning disabled, auto-unroll search over 1/2/4/8, spm_mode=on, multihop=1.
      arch_filter:
