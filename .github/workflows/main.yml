name: Build and Smoke Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enforce generated-artifact tracking policy
        run: bash scripts/check_no_generated_tracked.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install LLVM and Clang 10
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "10.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gcc-multilib \
            g++-multilib \
            graphviz \
            libtinfo5

      - name: Install Python dependencies
        run: python3 -m pip install -r python_requirements.txt

      - name: Validate toolchain
        run: |
          opt -version
          clang --version
          g++ -v

      - name: Build all components
        run: bash build_all.sh

      - name: Smoke test array_add
        run: python3 -u run_morpher.py morpher_benchmarks/array_add/array_add.c array_add

      - name: Smoke test fir
        run: python3 -u run_morpher.py opencgra_benchmarks/fir/fir.c fir
