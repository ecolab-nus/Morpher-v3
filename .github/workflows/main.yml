name: Build and Smoke Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enforce generated-artifact tracking policy
        run: bash scripts/check_no_generated_tracked.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python_requirements.txt

      - name: Cache LLVM 18
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: /usr/lib/llvm-18
          key: llvm-18-apt-ubuntu-22.04

      - name: Install LLVM and Clang 18
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y llvm-18-dev

      - name: Link LLVM 18 tools into PATH
        run: |
          sudo ln -sf /usr/lib/llvm-18/bin/clang /usr/bin/clang
          sudo ln -sf /usr/lib/llvm-18/bin/opt /usr/bin/opt
          echo "MORPHER_LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV
          echo "MORPHER_LLVM_BIN_DIR=/usr/lib/llvm-18/bin" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gcc-multilib \
            g++-multilib \
            graphviz \
            libtinfo5

      - name: Install Python dependencies
        run: python3 -m pip install -r python_requirements.txt

      - name: Validate toolchain
        run: |
          opt -version
          clang --version
          g++ -v

      - name: Build all components
        run: bash build_all.sh

      - name: Mapper regression suite 4x4
        run: python3 -u scripts/run_regression_benchmarks.py --suite ci_4x4
